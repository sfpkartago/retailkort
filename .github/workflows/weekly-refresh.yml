name: Ugentlig data-refresh

# Kører hver mandag kl. 04:00 UTC + kan startes manuelt fra Actions-fanen.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # så jobbet kan committe den friske retailkort_data.json tilbage

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Uden et loft kan jobbet hoble sig op mod GitHubs 6-timers graense: validate.py
    # sover 1+2+3+4+5 s pr. raekke naar DAWA afviser, hvilket over 10.300 raekker med
    # 8 traade alene er ~5,4 timers soevn.
    #
    # Job-loftet skal vaere stoerre end summen af trin-lofterne, ellers doer jobbet
    # midt i et trin der stadig har tid tilbage. Trin: 15 (OK+Tesla) + 25 (retail)
    # + 40 (validate) + 20 (reconcile) + 10 (CVR) = 110, plus checkout/opsaetning.
    timeout-minutes: 120
    # DAWA lukkede 1. oktober 2026. Adresseopslagene (dawa.py -> DAR via Datafordeleren)
    # kraever en API-noegle til frie data, oprettet i Datafordeler Administration under
    # IT-systemet "Retail Kort". Den ligger som repository-secret, aldrig i repoet.
    env:
      DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}
    steps:
      - name: Hent repo
        uses: actions/checkout@v4
        with:
          # Fuld historik. Standard er depth 1, og saa ser 'git log -1 -- <fil>' kun
          # den ene hentede commit — alle filer ville faa samme dato, og datostemplet
          # ville igen paastaa at alle otte lag er lige friske.
          fetch-depth: 0

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installér afhængigheder
        run: pip install openpyxl

      # Uden noeglen fejler hvert eneste adresseopslag. Stop HER med en besked der
      # siger hvad der mangler - ikke 40 minutter senere med 'dawa-nede' paa alle raekker.
      - name: Tjek Datafordeler-nøgle
        run: |
          if [ -z "$DATAFORDELER_API_KEY" ]; then
            echo "::error::Mangler secret DATAFORDELER_API_KEY (Settings -> Secrets and variables -> Actions). DAWA er lukket; uden noeglen kan adresser ikke slaas op."
            exit 1
          fi
          python3 -c "import dawa; n=len(dawa.postnumre()); print(f'DAR svarer: {n} postnumre'); assert n > 500"
          # BBR (tankstationsbygninger, se dawa._bbr_bygning) bruger samme noegle. Et udfald
          # rejser DawaNede, saa OK-trinnet ville afbryde; bedre at vide det her.
          python3 -c "import dawa; dawa._bbr_bygning(55.634949, 12.052626, '325'); print('BBR svarer')"

      - name: Frisk data (OK + Tesla via offentlige API'er)
        # 15, ikke 10: koerslen 30-09-2026 tog 6 min 10 s paa GitHub (53 s lokalt - hvert
        # DAR-kald gaar over Atlanten), og v3.1 spoerger BBR for de stationer hvor OK's
        # egen adresse ikke holder. Dette trin har ingen continue-on-error: timer det ud,
        # faar kortet ingen opdatering den uge.
        timeout-minutes: 15
        run: python3 refresh_data.py

      # Detailhandlen, tanken og spisestederne: 58 kaeder hentes fra deres egne kilder. Koerslen TILFOEJER kun
      # nye butikker; mulige lukninger og koordinat-afvigelser rapporteres i loggen og
      # skal vurderes i haanden. Baggrunden staar i refresh_retail.py's docstring: en
      # maalt erstatnings-koersel omskrev 1.248 adresser og genindfoerte 3 dubletter.
      # continue-on-error: en enkelt doed kilde maa ikke spaerre for resten af jobbet,
      # men trinnet lyser roedt saa man kan se det.
      - name: Frisk detailhandel, tank og spisesteder (58 kæder — tilføjer nye, rapporterer resten)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          python3 refresh_retail.py --apply 2>&1 | tee retail_refresh_report.txt

      - name: Genopbyg kort + Excel + feed
        run: python3 rebuild.py

      # Sikkerhedsspærre: hvis en kilde returnerer skrald og tallene kollapser,
      # så FEJL jobbet FØR commit — det gamle (gode) feed bliver liggende.
      #
      # De faste minima alene er FOR SVAGE: et halvt OK-svar (200 af 690 stationer)
      # giver tank=1652, altså over floor 1500, og ville være blevet publiceret.
      # Derfor sammenlignes nu OGSÅ mod det sidst committede feed: et fald på over
      # 2 % i et lag afbryder. Desuden tjekkes at ingen række mangler postnr/by,
      # så et DAWA-udfald ikke kan publicere adresseløse rækker.
      - name: Sanity-tjek af feed
        run: |
          git show HEAD:retailkort_data.json > /tmp/prev_feed.json 2>/dev/null || true
          python3 - <<'PY'
          import csv, json, os, sys
          d = json.load(open('retailkort_data.json', encoding='utf-8'))
          # ALLE otte lag tjekkes. Spaerren daekkede foer kun charge/food/tank, saa et
          # sammenbrud i de tre retail-lag eller de to lastbil-lag kunne publiceres frit.
          floor = {'charge': 500, 'food': 200, 'tank': 1500,
                   'daglig': 3000, 'udvalg': 1500, 'plads': 1200,
                   'truck': 10, 'tanktruck': 40}
          n = {k: d[k]['total'] for k in floor if k in d}
          print('Feed-tal:', n)
          fejl = []
          fejl += [f'{k} mangler helt i feedet' for k in floor if k not in d]
          fejl += [f'{k}={n[k]} under minimum {floor[k]}' for k in n if n[k] < floor[k]]
          # ... og et LOFT. Gaten maalte kun FALD, men refresh_retail.py kan kun
          # TILFOEJE, saa en kilde der pludselig lister lagre, webshops eller
          # udenlandske butikker ville puste laget op uden at noget sagde fra.
          # Loftet maales mod det sidst udgivne feed (nedenfor: højst +10 % pr.
          # koersel). Det FASTE loft (floor * 1,1 * 1,6) blokerede koerslerne 21. og
          # 28. september 2026: spisestedslaget var vokset fra 319 til 474 (cafeer og
          # juicebarer kom med), loftet blev aldrig justeret, og beskeden sagde endda
          # "over loftet 220", skoent graensen var 352. Her staar kun en grov
          # absolut graense (4 x minimum) til brug uden et tidligere feed.
          fejl += [f'{k}={n[k]} over den absolutte graense {floor[k] * 4} — en kilde lister noget nyt?'
                   for k in n if n[k] > floor[k] * 4]

          if os.path.getsize('/tmp/prev_feed.json') if os.path.exists('/tmp/prev_feed.json') else 0:
              p = json.load(open('/tmp/prev_feed.json', encoding='utf-8'))
              for k in n:
                  was = (p.get(k) or {}).get('total')
                  if was and n[k] < was * 0.98:
                      fejl.append(f'{k} faldt {was} -> {n[k]} ({100*(was-n[k])/was:.1f} %)')
                  # refresh_retail.py tilfoejer hoejst 10 % pr. maerke; et helt lag der
                  # vokser mere end 10 % paa én koersel er en kilde der lister noget nyt.
                  if was and n[k] > was * 1.10:
                      fejl.append(f'{k} voksede {was} -> {n[k]} (+{100*(n[k]-was)/was:.1f} %) — en kilde lister noget nyt?')
              print('Forrige feed:', {k: (p.get(k) or {}).get('total') for k in n})
          else:
              print('(intet tidligere feed at sammenligne med)')

          for fn, pi, bi in (('tankstationer_dk.csv', 3, 4), ('superladere_dk.csv', 3, 4),
                             ('fastfood_kaeder_dk.csv', 3, 4), ('dagligvarer_dk.csv', 3, 4),
                             ('udvalgsvarer_dk.csv', 3, 4), ('pladskraevende_dk.csv', 3, 4)):
              rows = list(csv.reader(open(fn, encoding='utf-8-sig')))[1:]
              tomme = [r for r in rows if not str(r[pi]).strip() or not str(r[bi]).strip()]
              if tomme:
                  fejl.append(f'{fn}: {len(tomme)} række(r) uden postnr/by '
                              f'(fx {tomme[0][1]!r}) — DAWA-udfald?')

          if fejl:
              sys.exit('AFBRYDER — publicerer IKKE:\n  - ' + '\n  - '.join(fejl))
          print('Sanity-tjek OK')
          PY

      # Rapporten skal skrives selv naar validate.py fejler eller timer ud — ellers
      # bliver den GAMLE validation_report.txt liggende og committet, og en doed
      # kontrol ser ud som en ren.
      - name: Kvalitetskontrol (informativ, blokerer ikke)
        continue-on-error: true
        # 40, ikke 25: efter DAWA-lukningen laver validate.py ~3 kald pr. raekke mod
        # DAR/Adressevaelgeren (DAWA: 1-2). Lokalt ~5 min; paa GitHub tog den 22 min 30 s
        # den 30-09-2026 - runnerne staar i udlandet, saa hvert kald er langsommere.
        timeout-minutes: 40
        # Advarslen skrives FOERST: validate.py skriver rapporten til sidst og overskriver
        # den saa. Timer trinnet ud, draeber GitHub hele skallen, saa '|| echo' aldrig
        # koerer - rapporten ville blive committet TOM, uden et ord om hvorfor.
        run: |
          echo "VALIDATE.PY BLEV IKKE FÆRDIG (fejl eller timeout) — der er ingen kvalitetskontrol for denne kørsel" > validation_report.txt
          python3 validate.py || echo "VALIDATE.PY FEJLEDE — rapporten er ufuldstændig" >> validation_report.txt

      # Afstemning mod de øvrige kilder RAPPORTERER kun — den ændrer ingen data.
      # Kandidater skal vurderes i hånden: kørslen 2026-09-08 viste at 12 af 26
      # var falske (roaming-skygger, planlagte anlæg, lastbilanlæg, kildefejl).
      # Se REFRESH_LOG.md. Rapporten ligger i jobbets log + reconcile_report.txt.
      # pipefail: uden den vinder tee's exit-kode, og en død kilde blev committet
      # som en TOM rapport der lignede en ren afstemning.
      - name: Afstemning mod øvrige kilder (rapport, blokerer ikke)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          : > reconcile_report.txt
          python3 reconcile.py 2>&1 | tee reconcile_report.txt

      # Tanklagets adresser holdt op mod CVR-produktionsenhederne (Virks data via
      # Datafordeleren). RAPPORTERER kun - se cvr_tjek.py. cvr_tjek.py skriver selv en
      # advarsel i rapporten foerst, saa en doed kontrol ikke ligner en ren.
      - name: CVR-tjek af tankstationernes adresser (rapport, blokerer ikke)
        continue-on-error: true
        timeout-minutes: 10
        run: python3 cvr_tjek.py

      - name: Commit frisk feed
        run: |
          git config user.name "kartago-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          # --ignore-missing findes ikke for git add, så filtrér selv: et manglende
          # reconcile_report.txt fik ellers 'git add' til at fejle (exit 128) og
          # dræbte HELE commit-trinnet, så det friske feed aldrig blev publiceret.
          # Én fil ad gangen — så afhænger det ikke af om shellen ordopdeler.
          for f in retailkort_data.json superladere_dk.csv tankstationer_dk.csv \
                   dagligvarer_dk.csv udvalgsvarer_dk.csv pladskraevende_dk.csv \
                   fastfood_kaeder_dk.csv kaede_adresser.xlsx kort_soeg.html \
                   validation_report.txt reconcile_report.txt \
                   retail_refresh_report.txt cvr_report.txt; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Ingen ændringer — intet at committe."
          else
            git commit -m "Ugentlig data-refresh (OK + Tesla + 58 kæder) [skip ci]"
            git push
          fi
